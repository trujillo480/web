<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat en Vivo</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
  <script defer src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script defer src="emoji.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div id="chat-container" style="display: none;">
    <h2>Chat en Vivo</h2>
    <div id="user-list"></div>
    <div id="messages"></div>
    <form id="form">
      <div id="emoji-wrapper">
        <button id="toggle-emoji-picker" type="button">😀</button>
        <emoji-picker id="emoji-picker" style="max-width: 250px;"></emoji-picker>
      </div>
      <input id="input" autocomplete="off" placeholder="Escribe tu mensaje..." />
      <button id="send">Enviar</button>
    </form>
  </div>
</body>
</html>
